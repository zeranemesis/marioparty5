name: Port

# Builds the native port on the four platforms it targets. No game data is
# involved: the port reads the player's own disc at run time.

on:
  push:
    branches: ['**']
    tags: ['v*']   # a version tag also publishes a GitHub release (job "release")
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (MSVC x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply dependency patches
        shell: bash
        run: |
          git -C extern/musyx apply --check ../../patches/musyx-mp5.patch
          git -C extern/musyx apply ../../patches/musyx-mp5.patch
          git -C extern/aurora apply --check ../../patches/aurora-mp5.patch
          git -C extern/aurora apply ../../patches/aurora-mp5.patch

      - name: Enable Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Override VCPKG_ROOT
        shell: bash
        run: echo "VCPKG_ROOT=C:\vcpkg" >> $GITHUB_ENV

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      - name: Install dependencies
        run: |
          choco install ninja
          vcpkg install freetype:x64-windows-static zstd:x64-windows-static

      - name: Configure
        run: cmake --preset x-windows-ci-msvc

      - name: Build
        run: cmake --build --preset x-windows-ci-msvc

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mp5native-windows-x86_64
          path: |
            build/install/*.exe
            build/install/*.dll
            build/install/*.db
            build/install/res/

  linux:
    name: Linux (GCC x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply dependency patches
        run: |
          git -C extern/musyx apply --check ../../patches/musyx-mp5.patch
          git -C extern/musyx apply ../../patches/musyx-mp5.patch
          git -C extern/aurora apply --check ../../patches/aurora-mp5.patch
          git -C extern/aurora apply ../../patches/aurora-mp5.patch

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install ninja-build clang lld openssl libcurl4-openssl-dev \
            zlib1g-dev libglu1-mesa-dev libdbus-1-dev libvulkan-dev libxi-dev libxrandr-dev \
            libasound2-dev libpulse-dev libudev-dev libpng-dev libncurses5-dev libx11-xcb-dev \
            libfreetype-dev libxinerama-dev libxcursor-dev python3-markupsafe libgtk-3-dev \
            libssl-dev libxss-dev libfuse2 libusb-1.0-0-dev libdecor-0-dev libpipewire-0.3-dev \
            libunwind-dev

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      - name: Configure
        run: cmake --preset x-linux-ci-gcc

      - name: Build
        run: cmake --build --preset x-linux-ci-gcc

      - name: Package AppImage
        run: ci/build-appimage.sh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mp5native-linux-x86_64
          path: build/install/*.AppImage

  macos:
    name: macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply dependency patches
        run: |
          git -C extern/musyx apply --check ../../patches/musyx-mp5.patch
          git -C extern/musyx apply ../../patches/musyx-mp5.patch
          git -C extern/aurora apply --check ../../patches/aurora-mp5.patch
          git -C extern/aurora apply ../../patches/aurora-mp5.patch

      - name: Install dependencies
        run: brew install cmake ninja

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      - name: Configure
        run: cmake --preset x-macos-ci-arm64

      - name: Build
        run: cmake --build --preset x-macos-ci-arm64

      # artifacts drop the executable bit: zip the bundle here
      - name: Zip the app bundle
        run: ditto -c -k --keepParent build/install/Mp5Native.app build/Mp5Native-macos.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mp5native-macos-arm64
          path: build/Mp5Native-macos.zip

  android:
    name: Android (arm64-v8a)
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: "27.2.12479018"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply dependency patches
        run: |
          git -C extern/musyx apply --check ../../patches/musyx-mp5.patch
          git -C extern/musyx apply ../../patches/musyx-mp5.patch
          git -C extern/aurora apply --check ../../patches/aurora-mp5.patch
          git -C extern/aurora apply ../../patches/aurora-mp5.patch

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install ninja-build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Install the Rust target nod is built for
        run: |
          rustup toolchain install stable
          rustup target add aarch64-linux-android

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      - name: Configure
        run: cmake --preset x-android-ci-arm64

      - name: Build the native library
        run: cmake --build --preset x-android-ci-arm64 --target mp5native

      - name: Stage the stripped JNI library
        run: ANDROID_STAGE_ABIS="arm64-v8a" platforms/android/scripts/stage-jni-libs.sh

      - name: Build the APK
        working-directory: platforms/android
        run: ./gradlew :app:assembleRelease --rerun-tasks

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mp5native-android-arm64
          path: platforms/android/app/build/outputs/apk/release/*.apk

  release:
    name: Release
    # a v* tag publishes what built; Windows is required, the other platforms join when they succeed
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.windows.result == 'success'
    needs: [windows, linux, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        working-directory: artifacts
        run: |
          chmod +x mp5native-linux-x86_64/*.AppImage 2>/dev/null || true
          for d in */; do
            n=${d%/}
            if ls "$n"/*.zip >/dev/null 2>&1; then
              mv "$n"/*.zip "$n-$GITHUB_REF_NAME.zip"
            else
              (cd "$n" && zip -qry "../$n-$GITHUB_REF_NAME.zip" .)
            fi
          done
          ls -la *.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          body: |
            Native PC port of Mario Party 5. No game data is included: the port asks for your own disc image (GameCube, USA or EUR) at first launch.
            The game tells you on its start screen when a newer release is available.
